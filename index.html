<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SIREI · Sistema de Retroalimentación Educativa Inmediata</title>
  <meta name="description" content="Acceso oficial al Sistema de Retroalimentación Educativa Inmediata (SIREI). Plataforma institucional para la gestión y evaluación del aprendizaje.">
  <meta name="keywords" content="educación, SIREI, sistema, aprendizaje, evaluación">
  
  <!-- Favicon (SVG data URI) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e293b'/><text x='50' y='65' font-family='serif' font-size='50' font-weight='bold' fill='%23c2a671' text-anchor='middle'>S</text></svg>">
  
  <!-- Fuentes de Google: Inter y Source Serif 4 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  
  <!-- Estilos -->
  <link rel="stylesheet" href="css/stylesindex.css">
</head>
<body>
  <div class="container">
    <div class="login-card fade-in-up">
      <div class="logo-area">
        <div class="icono-escudo">
          <!-- Escudo Educativo Premium -->
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L3 6V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V6L12 2Z" fill="#1E293B" stroke="#C2A671" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M12 22.8C16.9 21.6 20.5 16.6 20.5 11V6.3L12 2.7L3.5 6.3V11C3.5 16.6 7.1 21.6 12 22.8Z" fill="#1E293B"/>
            <path d="M12 6V21C7.8 19.8 4.5 15.3 4.5 11V7.2L12 6Z" fill="#0F172A"/>
            <!-- Libro dentro del escudo -->
            <path d="M12 16L7 13.5V8.5L12 11L17 8.5V13.5L12 16Z" fill="#C2A671"/>
            <path d="M12 11V16" stroke="#1E293B" stroke-width="1"/>
            <path d="M12 11L7 8.5" stroke="#1E293B" stroke-width="1"/>
            <path d="M12 11L17 8.5" stroke="#1E293B" stroke-width="1"/>
          </svg>
        </div>
        <h1>SIREI</h1>
        <p class="subtitulo">Sistema de Retroalimentación Educativa Inmediata</p>
      </div>

      <!-- Formulario de Login -->
      <form id="loginForm">
        <div class="input-group">
          <label for="usuario">Usuario Institucional</label>
          <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" required autocomplete="off">
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            <button type="button" class="btn-toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <!-- Captcha Matemático -->
        <div class="captcha-group">
          <label for="captchaInput">Seguridad: ¿Cuánto es <span id="captchaQuestion">X + Y</span>?</label>
          <input type="text" id="captchaInput" placeholder="Resultado" required autocomplete="off">
        </div>

        <button type="submit" id="btnIngresar">
          <span class="btn-text">Ingresar al Sistema</span>
          <div class="spinner" id="btnSpinner" style="display: none;"></div>
        </button>
        <div id="mensajeError" class="mensaje-error"></div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script>
    const WEB_APP_URL = SIREI_CONFIG.ADMIN_API_URL;
  </script>
  <script src="js/authindex.js"></script>
</body>
</html>
